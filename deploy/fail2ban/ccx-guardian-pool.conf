# Fail2ban filter for conceal-guardian-pool rate limiter denials.
#
# The pool logs denied requests as single-line JSON objects into errors.log, e.g.:
# {"timestamp":"2026-02-06T02:38:27.812Z","message":"Denied list nodes request because of to many requests in short period from IP <w.x.y.z>","level":"error"}
#
# The two limiter log lines are emitted by index.js (update limiter and list
# limiter). They must stay byte-identical for this filter to keep matching.
#
# Install as /etc/fail2ban/filter.d/ccx-guardian-pool.conf and validate against
# the real log before enabling the jail:
#   fail2ban-regex /home/<user>/.local/share/ccxNodePool/errors.log /etc/fail2ban/filter.d/ccx-guardian-pool.conf

[Definition]

failregex = ^.*"message":"Denied (update|list) nodes? request[^"]* from IP <HOST>".*$

# Authoritative datepattern: ISO8601 UTC timestamp with fractional seconds,
# exactly as the pool writes it ("2026-02-06T02:38:27.812Z").
datepattern = {^"timestamp":"%%Y-%%m-%%dT%%H:%%M:%%S\.%%fZ"}

# Fallback for older fail2ban versions that reject the fraction-aware form:
#   {^"timestamp":"%%Y-%%m-%%dT%%H:%%M:%%S}
# (whole seconds; the millisecond fraction is ignored)

journalmatch =
